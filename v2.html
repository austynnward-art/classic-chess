<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rebel Classic Chess</title><style>
:root{font-family:Inter,system-ui,sans-serif;background:#0b0d10;color:#f5f6f7;--panel:#14171c;--muted:#9aa1ab;--line:#262b33;--soft:#1b2027}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#222831 0,#0b0d10 42%);min-height:100vh}
.rebel-shell{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.rebel-sidebar{border-right:1px solid var(--line);background:#101318;padding:24px 16px;display:flex;flex-direction:column;gap:28px}.rebel-brand{display:flex;flex-direction:column;letter-spacing:.08em}.rebel-brand strong{font-size:26px}.rebel-brand span,.eyebrow{font-size:11px;color:#aeb5bf;letter-spacing:.16em}.rebel-nav{display:grid;gap:6px}.rebel-nav-item{border:0;background:transparent;color:#aeb5bf;padding:13px 14px;border-radius:10px;text-align:left;display:flex;gap:12px;align-items:center;font-size:15px;cursor:pointer}.rebel-nav-item:hover{background:var(--soft);color:#fff}.rebel-sidebar-card,.course-card,.hero-card,.empty-state,.metric-grid>div,.progress-card,.feature-card,.course-detail,.chapter,.course-hero{background:var(--panel);border:1px solid var(--line);border-radius:14px}.rebel-sidebar-card{margin-top:auto;padding:15px;display:grid;gap:5px}.rebel-sidebar-card span,.course-card p,.hero-card p,.metric-grid span,.progress-card span,.feature-card span,.course-hero p,.lesson-copy p{color:var(--muted)}.rebel-main{padding:30px 42px;max-width:1500px;width:100%;margin:auto}.rebel-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px}.rebel-header h1{margin:5px 0 0;font-size:32px}.rebel-status{font-size:12px;color:#aeb5bf;padding:9px 12px;border:1px solid var(--line);border-radius:9px}.hero-card{padding:42px}.hero-card h2{font-size:42px;line-height:1.05;max-width:760px;margin:12px 0}.hero-card p{font-size:17px;max-width:650px;line-height:1.6}.primary,.secondary,.filter{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:#f4f5f6;color:#101318}.secondary,.filter{background:#252b34;color:#fff}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.metric-grid>div{padding:20px;display:grid;gap:7px}.metric-grid b{font-size:28px}.section-heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.section-heading h2{margin:5px 0;font-size:32px}.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.course-card{padding:22px}.course-card.featured{min-height:220px}.course-card h3{font-size:23px;margin:12px 0 8px}.course-tag{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#aeb5bf}.course-footer{display:flex;align-items:center;justify-content:space-between;margin-top:18px;font-size:12px;color:var(--muted)}.course-hero{padding:28px;margin-bottom:18px}.course-hero h2{font-size:36px;margin:8px 0}.filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.filter{font-size:12px}.filter.active{outline:2px solid #777}.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.progress-card{padding:28px;display:flex;flex-direction:column;gap:10px}.progress-card strong{font-size:36px}.progress-track{height:8px;background:#252b34;border-radius:8px;overflow:hidden}.progress-track i{display:block;height:100%;background:#e0b84f}.home-actions{display:flex;gap:10px}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.feature-card{text-align:left;padding:20px;color:#fff;cursor:pointer;display:grid;gap:8px}.course-detail{padding:24px;margin-top:20px}.course-detail-head{display:flex;justify-content:space-between;gap:20px;align-items:center}.course-detail-head h2{font-size:34px;margin:7px 0}.chapter-list{display:grid;gap:10px;margin-top:22px}.chapter{overflow:hidden}.chapter-head{display:flex;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);align-items:center}.chapter-head span{font-size:11px;color:var(--muted)}.lesson-list{display:grid}.lesson-row{display:grid;grid-template-columns:25px 1fr auto;gap:8px;text-align:left;padding:14px 18px;border:0;border-bottom:1px solid var(--line);background:transparent;color:#fff;cursor:pointer}.lesson-row:hover{background:var(--soft)}.lesson-row small{color:var(--muted)}.lesson-view{display:grid;grid-template-columns:300px minmax(420px,760px);gap:24px;margin-top:22px;align-items:start}.lesson-copy{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px}.lesson-copy h3{font-size:28px;margin:0}.lesson-step{display:flex;gap:10px;align-items:flex-start;padding:14px;background:var(--soft);border-radius:10px}.lesson-step b{font-size:20px}.achievement-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.achievement-row div{padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--soft);display:grid;gap:5px}.achievement-row span{color:var(--muted);font-size:13px}.rebel-workspace{display:grid;grid-template-columns:minmax(420px,760px) minmax(260px,1fr);gap:24px;align-items:start}.rebel-board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:4px solid #20252c;border-radius:10px;overflow:hidden;background:#b7b7b7}.rebel-square{border:0;font-size:clamp(24px,5vw,54px);display:grid;place-items:center;cursor:pointer}.rebel-square:nth-child(16n+1),.rebel-square:nth-child(16n+3),.rebel-square:nth-child(16n+5),.rebel-square:nth-child(16n+7),.rebel-square:nth-child(16n+10),.rebel-square:nth-child(16n+12),.rebel-square:nth-child(16n+14),.rebel-square:nth-child(16n+16){background:#eee}.rebel-square:nth-child(16n+2),.rebel-square:nth-child(16n+4),.rebel-square:nth-child(16n+6),.rebel-square:nth-child(16n+8),.rebel-square:nth-child(16n+9),.rebel-square:nth-child(16n+11),.rebel-square:nth-child(16n+13),.rebel-square:nth-child(16n+15){background:#777}.rebel-square.selected{outline:4px solid #e0b84f;outline-offset:-4px}.rebel-board-controls{display:flex;gap:10px;margin-top:12px}.rebel-board-controls button{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.rebel-board-status{margin-top:10px;color:var(--muted)}.rebel-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;min-height:220px}.rebel-panel h3{margin-top:0}.analysis-row{display:grid;grid-template-columns:1fr auto;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}.analysis-row small{grid-column:1/-1;color:var(--muted)}@media(max-width:900px){.rebel-workspace,.lesson-view,.home-grid{grid-template-columns:1fr}.feature-grid{grid-template-columns:1fr}.rebel-main{padding:22px}}@media(max-width:800px){.rebel-shell{grid-template-columns:1fr}.rebel-sidebar{position:static}.metric-grid{grid-template-columns:repeat(2,1fr)}.hero-card h2{font-size:32px}.achievement-row{grid-template-columns:1fr}}
</style></head>
