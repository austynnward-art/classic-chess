name: Apply Courses CSS
on:
  push:
    paths:
      - courses-redesign.css
      - .github/workflows/apply-courses-css.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); p.write_text(s if "courses-redesign.css" in s else s.replace("</head>", "<link rel=\"stylesheet\" href=\"courses-redesign.css\"></head>", 1))'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable Courses visual redesign [skip ci]" || true
          git push