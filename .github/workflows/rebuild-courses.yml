name: Apply Courses visual rebuild
on:
  push:
    paths:
      - .github/workflows/rebuild-courses.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Courses styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          css=r'''
/* COURSES-REDESIGN-V3 */
body.contentPage .coursesShell{max-width:1160px!important;margin:0 auto!important}
body.contentPage .courseReferenceDashboard{font-family:Inter,Arial,sans-serif!important;color:#173851!important}
body.contentPage .courseReferenceHero{display:grid!important;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr)!important;min-height:310px!important;margin:0 0 22px!important;border-radius:24px!important;overflow:hidden!important;background:linear-gradient(135deg,#f7fbff 0%,#eef6ff 52%,#f4efff 100%)!important;border:1px solid #d7e5f0!important;box-shadow:0 18px 42px rgba(8,45,75,.14)!important}
body.contentPage .courseReferenceHeroCopy{padding:46px 48px!important;display:flex!important;flex-direction:column!important;justify-content:center!important}
body.contentPage .courseReferenceKicker,body.contentPage .courseRefSectionHead>div>span,body.contentPage .refSectionTag{font-size:11px!important;font-weight:900!important;letter-spacing:1.8px!important;color:#1778bb!important}
body.contentPage .courseReferenceHeroCopy h2{margin:9px 0 10px!important;font-size:42px!important;line-height:1.04!important;color:#123a58!important;letter-spacing:-1.2px!important}
body.contentPage .courseReferenceHeroCopy p{max-width:560px!important;margin:0!important;font-size:15px!important;color:#60788a!important;line-height:1.6!important}
body.contentPage .courseHeroActionRow{display:flex!important;gap:10px!important;margin-top:20px!important}
body.contentPage .courseRefPrimary,body.contentPage .courseRefSecondary{height:42px!important;padding:0 18px!important;border-radius:10px!important;font-size:13px!important;font-weight:850!important}
body.contentPage .courseRefPrimary{background:#1b83e8!important;border-color:#1b83e8!important;box-shadow:0 7px 16px rgba(27,131,232,.22)!important}
body.contentPage .courseRefSecondary{background:#fff!important;border-color:#c9dce9!important}
body.contentPage .courseReferenceHeroArt{min-height:310px!important;background:radial-gradient(circle at 52% 37%,#fff 0 28%,transparent 29%),linear-gradient(180deg,#d9ebf8,#f0ecff)!important}
body.contentPage .courseRefBubble{right:24px!important;top:22px!important;width:190px!important;padding:12px 13px!important;border-radius:12px!important;box-shadow:0 10px 24px rgba(20,62,90,.12)!important}
body.contentPage .courseRefBubble b{font-size:11px!important}.courseRefBubble span{font-size:10px!important}
body.contentPage .courseRefCoach{width:180px!important;height:220px!important}
body.contentPage .refCoachFace{left:48px!important;top:28px!important;width:84px!important;height:100px!important}
body.contentPage .refCoachHair{left:41px!important;top:18px!important;width:98px!important;height:73px!important}
body.contentPage .refCoachGlasses{left:43px!important;top:55px!important;gap:3px!important}.refCoachGlasses i{width:41px!important;height:25px!important}
body.contentPage .refCoachBody{left:22px!important;width:136px!important;height:108px!important;border-radius:68px 68px 16px 16px!important}
body.contentPage .courseRefSection{margin-top:22px!important}.courseRefSectionHead{margin-bottom:12px!important}.courseRefSectionHead h3{font-size:21px!important;margin:4px 0 0!important;color:#173851!important}.courseRefSectionHead button{font-size:12px!important}
body.contentPage .courseRefGrid{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:14px!important}
body.contentPage .courseRefCard{min-height:190px!important;border-radius:16px!important;border:1px solid #d9e6ee!important;box-shadow:0 10px 24px rgba(18,58,89,.08)!important;transition:transform .16s ease,box-shadow .16s ease!important}
body.contentPage .courseRefCard:hover{transform:translateY(-3px)!important;box-shadow:0 15px 30px rgba(18,58,89,.13)!important}
body.contentPage .courseRefIcon{left:13px!important;top:13px!important;width:42px!important;height:42px!important;border-radius:12px!important;font-size:20px!important}
body.contentPage .courseRefCard h4{font-size:16px!important;margin:64px 14px 6px!important;color:#183d58!important}
body.contentPage .courseRefCard p{font-size:12px!important;line-height:1.45!important;margin:0 14px!important;color:#6b8190!important}
body.contentPage .courseRefCard button{margin:13px 14px 14px!important;height:34px!important;border-radius:9px!important;font-size:11px!important;font-weight:850!important}
body.contentPage .courseRefLowerGrid{display:grid!important;grid-template-columns:1.35fr .65fr!important;gap:14px!important;margin-top:22px!important}
body.contentPage .courseProgressCard,body.contentPage .coursePreviewCard,body.contentPage .courseResourceCard{background:#fff!important;border:1px solid #d9e6ee!important;border-radius:16px!important;box-shadow:0 10px 24px rgba(18,58,89,.07)!important;padding:20px!important}
body.contentPage .courseProgressCard h3,body.contentPage .coursePreviewCard h3,body.contentPage .courseResourceCard h3{font-size:18px!important;color:#173851!important}
body.contentPage .courseProgressBar{height:9px!important;border-radius:99px!important;background:#e4edf3!important;overflow:hidden!important}.courseProgressBar i{height:100%!important;border-radius:99px!important;background:linear-gradient(90deg,#2389e8,#55b8ff)!important}
body.contentPage .coursePreviewBoard{border-radius:12px!important;overflow:hidden!important;box-shadow:0 8px 20px rgba(10,30,45,.14)!important}
body.contentPage .courseResourceGrid{display:grid!important;grid-template-columns:repeat(2,1fr)!important;gap:10px!important}
body.contentPage .courseResourceCard{min-height:90px!important;border-radius:12px!important;padding:12px!important;background:#f8fbfd!important;border:1px solid #dce8ef!important}
@media(max-width:900px){body.contentPage .courseReferenceHero{grid-template-columns:1fr!important}body.contentPage .courseReferenceHeroArt{min-height:250px!important}body.contentPage .courseRefGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}body.contentPage .courseRefLowerGrid{grid-template-columns:1fr!important}}
@media(max-width:560px){body.contentPage .courseReferenceHeroCopy{padding:30px 24px!important}body.contentPage .courseReferenceHeroCopy h2{font-size:32px!important}body.contentPage .courseRefGrid{grid-template-columns:1fr!important}}
'''
          if "COURSES-REDESIGN-V3" not in s:
              s=s.replace("</style>",css+"\n</style>",1)
              p.write_text(s)
          PY
      - name: Commit rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Rebuild Courses page visual hierarchy [skip ci]"
          git push
