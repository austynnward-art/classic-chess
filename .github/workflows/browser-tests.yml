name: Browser Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate application JavaScript
        run: node -e "const fs=require('fs');const c=fs.readFileSync('index.html','utf8');const m=c.match(/<script[^>]*type=[\\"']module[\\"'][^>]*>([\\s\\S]*?)<\\/script>/);if(!m)throw new Error('No module application script found');const js=m[1].replace(/^\\s*import[\\s\\S]*?;\\s*/,'');new Function(js);if(/\\\\n/.test(js))throw new Error('Literal \\n escape found in application source');console.log('Application JavaScript syntax OK')"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14