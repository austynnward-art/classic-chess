name: Chess app syntax check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Extract JavaScript
        run: |
          node -e 'const fs=require("fs"); const s=fs.readFileSync("index.html","utf8"); const m=s.match(/<script>([\\s\\S]*?)<\\/script>/); if(!m) throw new Error("No inline script found"); fs.writeFileSync("/tmp/app.js",m[1]); console.log("Extracted",m[1].length,"characters");'
      - name: Check JavaScript syntax
        run: node --check /tmp/app.js
