name: Chess app syntax and startup check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Extract JavaScript
        run: |
          node -e 'const fs=require("fs"),h=fs.readFileSync("index.html","utf8"),a=h.indexOf("<script>")+8,b=h.indexOf("</script>",a);if(a<8||b<0)process.exit(1);fs.writeFileSync("/tmp/app.js",h.slice(a,b));'
          node --check /tmp/app.js
      - name: Install DOM test runner
        run: npm install --no-save jsdom@26.1.0
      - name: Run startup test
        run: |
          node <<'NODE'
          const fs=require("fs");
          const {JSDOM,VirtualConsole}=require("jsdom");
          const html=fs.readFileSync("index.html","utf8");
          const errors=[];
          const vc=new VirtualConsole();
          vc.on("jsdomError",e=>errors.push(String(e && e.stack || e)));
          const dom=new JSDOM(html,{
            runScripts:"dangerously",
            pretendToBeVisual:true,
            virtualConsole:vc,
            beforeParse(window){
              window.Worker=class{
                constructor(){this.onmessage=null}
                postMessage(msg){
                  if(msg==="uci"&&this.onmessage){this.onmessage({data:"uciok"});return;}
                  if(typeof msg==="string"&&msg.startsWith("go ")&&this.onmessage){
                    setTimeout(()=>{this.onmessage({data:"info depth 8 score cp 20"});this.onmessage({data:"bestmove e2e4"});},5);
                  }
                }
                terminate(){}
              };
              if(!window.URL.createObjectURL)window.URL.createObjectURL=()=> "blob:stub";
              window.URL.revokeObjectURL=()=>{};
            }
          });
          (async()=>{
            const board=dom.window.document.querySelectorAll("#board .sq").length;
            const course=dom.window.document.querySelectorAll("#courseBoard .courseSq").length;
            if(errors.length) { console.error(errors.join("\n---\n")); process.exit(1); }
            if(!html.startsWith("<!doctype html>")) { console.error("index.html has unexpected content before doctype"); process.exit(1); }
            if(!dom.window.document.querySelector("#botSpeech")) { console.error("Bot speech panel missing"); process.exit(1); }
            if(!dom.window.document.querySelector("#analyze")) { console.error("Analyze control missing"); process.exit(1); }
            if(board!==64) { console.error("Main board has",board,"squares"); process.exit(1); }
            if(course!==64) { console.error("Course board has",course,"squares"); process.exit(1); }
            const initialPieces=[...dom.window.document.querySelectorAll("#board svg[data-piece]")].map(x=>x.getAttribute("data-piece"));
            const requiredPieces=["wk","wq","wr","wb","wn","wp","bk","bq","br","bb","bn","bp"];
            if(requiredPieces.some(p=>!initialPieces.includes(p))) { console.error("Initial piece SVG set incomplete"); process.exit(1); }
            if(!dom.window.document.querySelector("#playPage") || !dom.window.document.querySelector("#botPage") || !dom.window.document.querySelector("#threePage") || !dom.window.document.querySelector("#fourPage") || !dom.window.document.querySelector("#learnPage") || !dom.window.document.querySelector("#coursesPage")) { console.error("Page navigation missing"); process.exit(1); }
            if(!dom.window.document.querySelector('[data-mode="computer"]') || !dom.window.document.querySelector('[data-mode="local2"]') || !dom.window.document.querySelector('[data-mode="local3"]') || !dom.window.document.querySelector('[data-mode="local4"]')) { console.error("Game mode controls missing"); process.exit(1); }

            // Exercise the actual UI in local two-player mode.
            const local2=dom.window.document.querySelector('[data-mode="local2"]');
            local2.click();
            const move=(from,to)=>{
              const file=c=>c.charCodeAt(0)-97;
              const idx=algebraic=>{const f=file(algebraic[0]),r=8-Number(algebraic[1]);return r*8+f;};
              const squares=()=>[...dom.window.document.querySelectorAll("#board .sq")];
              squares()[idx(from)].click(); squares()[idx(to)].click();
            };
            move("e2","e4");
            await new Promise(resolve=>setTimeout(resolve,60));
            const liveReview=dom.window.document.querySelector("#reviewMoveList")?.textContent||"";
            if(!/Great move|Good move|Mistake|Blunder/.test(liveReview)) { console.error("Live move review grade did not appear"); process.exit(1); }
            if(!dom.window.document.querySelector("#botSpeech")?.textContent.includes("move")) { console.error("Bot feedback text did not update"); process.exit(1); }
            move("e7","e5");
            move("g1","f3"); move("g8","f6");
            move("f1","e2"); move("f8","e7");
            move("e1","g1");
            dom.window.document.querySelector("#analyze").click();
            await new Promise(resolve=>setTimeout(resolve,40));
            if(dom.window.document.querySelector("#engineStatus")?.textContent!=="Stockfish ready") { console.error("Analyze completion callback failed"); process.exit(1); }
            if(dom.window.document.querySelector("#best-move")?.textContent==="—") { console.error("Analyze best-move output failed"); process.exit(1); }
            const finalSquares=[...dom.window.document.querySelectorAll("#board .sq")];
            if(!dom.window.document.querySelector("#moves").textContent.includes("O-O")) { console.error("Castling SAN test failed"); process.exit(1); }

            const kingG1=finalSquares[6+7*8]?.querySelector('svg[data-piece="wk"]');
            const rookF1=finalSquares[5+7*8]?.querySelector('svg[data-piece="wr"]');
            if(!kingG1 || !rookF1) { console.error("Castling UI test failed"); process.exit(1); }

            // Exercise the page switching and 3/4-player board creation.
            dom.window.document.querySelector("#botPage").click();
            if(dom.window.document.querySelector("#gameMode").value!=="computer") { console.error("Bot page did not select computer mode"); process.exit(1); }
            dom.window.document.querySelector("#threePage").click();
            if(dom.window.document.querySelector("#gameMode").value!=="local3") { console.error("Three-player page did not select 3-player mode"); process.exit(1); }
            if(dom.window.document.querySelectorAll("#multiBoard .multiSq").length!==196) { console.error("Three-player board was not created"); process.exit(1); }
            dom.window.document.querySelector("#fourPage").click();
            if(dom.window.document.querySelector("#gameMode").value!=="local4") { console.error("Four-player page did not select 4-player mode"); process.exit(1); }
            if(dom.window.document.querySelectorAll("#multiBoard .multiSq").length!==196) { console.error("Four-player board was not created"); process.exit(1); }
            dom.window.document.querySelector("#learnPage").click();
            if(!dom.window.document.querySelector(".layout").classList.contains("learnPageMode")) { console.error("Learn page switch failed"); process.exit(1); }
            dom.window.document.querySelector("#coursesPage").click();
            if(!dom.window.document.querySelector(".layout").classList.contains("coursesPageMode")) { console.error("Courses page switch failed"); process.exit(1); }
            dom.window.document.querySelector("#fourPage").click();
            const multi=dom.window.document.querySelectorAll("#multiBoard .multiSq");
            if(multi.length!==196) { console.error("4-player board has",multi.length,"squares"); process.exit(1); }

            // Exercise the Learn-page trainer with a real opening move and reply.
            dom.window.document.querySelector("#learnPage").click();
            dom.window.document.querySelector('[onclick="startLearningGame(\'e4\')"]').click();
            const learnSquares=()=>[...dom.window.document.querySelectorAll("#learningBoard .learningSq")];
            const lidx=a=>{const f=a.charCodeAt(0)-97,r=8-Number(a[1]);return r*8+f;};
            learnSquares()[lidx("e2")].click(); learnSquares()[lidx("e4")].click();
            await new Promise(resolve=>setTimeout(resolve,700));
            const e5Piece=learnSquares()[lidx("e5")]?.querySelector('svg[data-piece="bp"]');
            if(!e5Piece) { console.error("Learning trainer reply failed; status="+dom.window.document.querySelector("#trainerStatus")?.textContent+"; moves="+dom.window.document.querySelector("#trainerMoves")?.textContent); process.exit(1); }

            // Regression: starting a new game must clear the move-review history.
            dom.window.document.querySelector("#playPage").click();
            if(dom.window.document.querySelector("#gameMode").value!=="local2") { console.error("Page 1 did not select local 2-player mode"); process.exit(1); }
            dom.window.document.querySelector("#new").click();
            if((dom.window.document.querySelector("#reviewMoveList")?.textContent||"").trim()!=="") { console.error("New game did not clear review history"); process.exit(1); }
            console.log("DEEP UI TEST PASSED: startup, SVG pieces, live review, bot feedback, analysis callback, local moves, castling, pages, 4-player board, learning trainer, review reset");
            dom.window.close();
          })();
          NODE
