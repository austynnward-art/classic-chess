name: Chess app syntax check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Extract JavaScript
        run: python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text()
          m=re.search(r"<script>([\\s\\S]*?)</script>",s)
          if not m:
            raise SystemExit("No inline script found")
          Path("/tmp/app.js").write_text(m.group(1))
          print("Extracted",len(m.group(1)),"characters")
        PY
      - name: Check JavaScript syntax
        run: node --check /tmp/app.js
