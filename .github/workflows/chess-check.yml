name: Chess app syntax check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Extract JavaScript
        run: |
          sed -n '/<script>/,/<\\/script>/p' index.html | sed '1d;$d' > /tmp/app.js
          wc -c /tmp/app.js
      - name: Check JavaScript syntax
        run: node --check /tmp/app.js
