name: Classic Chess Walkthrough Video
on:
  push:
    paths:
      - tests/demo.spec.js
      - .github/workflows/walkthrough-video.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/demo.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-chess-walkthrough-video
          path: test-results/**/video.webm
          retention-days: 14